<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>HUD Polish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Sofia+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* The current HUD, same layout and components, given a careful design pass. Every value here is listed in
   changes.md. ?s=L12-mid | L12-ready | L2   &v=plus for the one-notch-bolder variant. */
:root {
  --num: 'Oswald', 'Arial Narrow', sans-serif; --font: 'Sofia Sans', system-ui, sans-serif;
  --enamel: #f8f7f2; --enamel-3: #dedcd3; --navy: #1f2e4d; --ink: #1b2436; --ink-2: #5c6779;
  --rule: rgba(31, 46, 77, 0.18); --red: #d62f2b; --yellow: #f5c518; --blue: #1e4fa3; --black: #15181e;
  --fuel: #ee8b1e; --fuel-2: #c96d0e; --ok: #2f8a72;
  --shadow-sm: 0 2px 6px rgba(18, 30, 52, 0.2);
  --hazard: repeating-linear-gradient(-45deg, #15181e 0 7px, #f5c518 7px 14px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 390px; height: 844px; overflow: hidden; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: #bfe3f5 0 0 / 390px 844px no-repeat; }
.phone > * { position: absolute; }
.plate { background: var(--enamel); border-radius: 7px; box-shadow: inset 0 0 0 2px rgba(31, 46, 77, 0.12), var(--shadow-sm); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 7px; background: var(--enamel); color: var(--navy); font: 600 17px/1 var(--num); letter-spacing: 0.06em; text-transform: uppercase; box-shadow: inset 0 0 0 2px rgba(31, 46, 77, 0.14), 0 3px 0 rgba(31, 46, 77, 0.28), var(--shadow-sm); }
.btn .u { text-transform: none; }
svg.g { display: block; flex: none; }
.flag { display: block; border-radius: 1.5px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22); }

/* title row and profit rule: as in the game, only the two captions grow to 11 px */
.hud-top { left: 10px; right: 10px; top: 8px; height: 44px; display: flex; gap: 8px; }
.hud-top .pause { width: 46px; height: 44px; }
.title { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 6px; }
.title .lv { display: grid; place-items: center; min-width: 34px; height: 32px; border-radius: 5px; background: var(--navy); color: #f8f7f2; font: 600 18px/1 var(--num); }
.title .tt { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.title .tt b { font: 600 17px/1 var(--num); letter-spacing: 0.03em; text-transform: uppercase; }
.title .tt small { font: 700 11px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.title .best { display: flex; gap: 1px; color: var(--ink-2); }
.rule { left: 10px; right: 10px; top: 58px; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 10px; }
.rule .money { display: flex; flex-direction: column; align-items: flex-end; min-width: 58px; font: 600 26px/1 var(--num); color: var(--navy); }
.rule .money .cap { font: 700 11px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 1px; }
.rule .money small { font-size: 15px; margin-right: 1px; vertical-align: 4px; }
.rule .rcol { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.rule .track { position: relative; height: 8px; border-radius: 4px; background: var(--enamel-3); }
.rule .mark { position: absolute; top: -3px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 1px; background: var(--ink-2); }
.rule .mark i { position: absolute; bottom: calc(100% + 1px); left: 50%; transform: translateX(-50%); font: 900 9px/1 var(--font); font-style: normal; letter-spacing: -1px; color: var(--ink-2); }
.rule .legend { display: flex; justify-content: space-between; color: var(--ink-2); }
.rule .legend span { display: inline-flex; align-items: center; white-space: nowrap; }
.rule .legend b { margin-left: 4px; font: 600 13px/1 var(--num); }

/* ── the route strip ── */
.strip { left: 10px; right: 10px; top: 110px; height: 94px; display: grid; align-items: start; padding: 7px 7px 7px; }
.port { display: grid; grid-template-rows: 16px 20px 13px 16px; justify-items: center; align-items: center; gap: 3px; min-width: 52px; padding: 3px 4px; border-radius: 6px; }
.port.here { background: var(--navy); color: #f8f7f2; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
.port.done { opacity: 0.5; }
.port .code { font: 600 16px/1 var(--num); letter-spacing: 0.04em; }
.port .code.chip { padding: 2px 6px 1px; border-radius: 3px; background: var(--pc); color: #fff; }
.port .pump { display: inline-flex; align-items: center; gap: 2px; font: 700 12px/1 var(--font); white-space: nowrap; }
.port .pump.none { color: var(--red); }
.port .pump.fin { color: var(--ink-2); }
.port.here .pump { color: #f8f7f2; }
.port .rob { display: inline-flex; align-items: center; gap: 2px; font: 600 15px/1 var(--num); color: var(--fuel-2); white-space: nowrap; }
.port .rob.short { padding: 3px 6px 2px; border-radius: 3px; background: var(--red); color: #fff; font: 800 12px/1 var(--font); letter-spacing: 0.08em; }
.leg { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px 0; min-width: 0; }
.leg .d { font: 700 12px/1 var(--font); color: var(--ink-2); white-space: nowrap; }
.leg .arrow { position: relative; width: 100%; height: 5px; border-radius: 3px; background: var(--band); margin: 2px 0 1px; }
.leg .arrow::after { content: ''; position: absolute; right: -2px; top: 50%; border-left: 8px solid var(--band); border-top: 6px solid transparent; border-bottom: 6px solid transparent; transform: translateY(-50%); }
.leg.later .arrow { height: 3px; }
.leg .burn { font: 600 15px/1 var(--num); color: var(--fuel-2); }
.leg .bn { font: 800 12px/1 var(--font); letter-spacing: 0.04em; color: var(--band); }
.leg.short .arrow { background: var(--hazard); }
.leg.short .arrow::after { border-left-color: var(--black); }
.leg.short .burn { color: var(--red); }

/* ── this call: the load bar and the fuel, one plate ── */
.cargo { left: 10px; right: 10px; top: 653px; height: 119px; padding: 8px 10px 7px; }
.load { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: 20px 18px; gap: 5px 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.load .tot { align-self: end; font: 600 24px/0.8 var(--num); color: var(--navy); white-space: nowrap; }
.load .tot small { font-size: 14px; color: var(--ink-2); margin-left: 1px; }
.load .sub { align-self: center; font: 700 12px/1 var(--font); color: var(--ink-2); white-space: nowrap; }
.load .sub.bad { color: var(--red); }
.load .sub.mark { color: var(--ok); }
.cells { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; }
.cells i { border-radius: 2px; background: var(--enamel-3); }
.cells i.c-fuel { background: var(--fuel); box-shadow: inset 0 -2px 0 var(--fuel-2); }
.cells i.c-need { background: repeating-linear-gradient(-45deg, var(--fuel) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1.5px var(--fuel); }
.cells .smark { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; border-radius: 1px; background: var(--red); }
.zones { display: flex; gap: 2px; }
.zones span { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; border-radius: 3px; background: var(--zt); color: var(--zc); font: 800 12px/1 var(--font); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; }
.zones span i { font-style: normal; font-weight: 700; letter-spacing: 0.01em; }
.zones span.on { background: var(--zc); color: #fff; }
.fuel { display: flex; align-items: center; gap: 6px; padding-top: 8px; height: 52px; }
.fuel .fl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.fuel .fl .cap { font: 700 12px/1 var(--font); color: var(--ink-2); white-space: nowrap; }
.fuel .fl .cap b { color: var(--ink); }
.fuel .fa { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.fuel .fa b { font: 600 26px/0.8 var(--num); color: var(--fuel-2); }
.fuel .fa b small { font-size: 16px; margin-left: 1px; }
.fuel .fa span { font: 600 13px/1 var(--font); color: var(--ink-2); }
.fuel .tok { width: 44px; height: 44px; padding: 0; }
.fuel .buy { min-width: 96px; height: 44px; padding: 0 10px; flex-direction: column; gap: 3px; background: var(--fuel); color: #fff; box-shadow: 0 3px 0 var(--fuel-2), var(--shadow-sm); }
.fuel .buy small { font: 700 12px/1 var(--font); letter-spacing: 0.02em; text-transform: none; }
.fuel .buy.ok { flex-direction: row; gap: 4px; background: var(--ok); box-shadow: 0 3px 0 #1f6553, var(--shadow-sm); }

/* ── the dock ── */
.dock { left: 10px; right: 10px; bottom: 12px; height: 52px; display: flex; gap: 8px; }
.dock .btn { height: 52px; }
.dock .undo { width: 52px; }
.dock .hint { flex: 1; }
.dock .hint::after { content: '3'; position: absolute; top: -7px; right: -5px; display: grid; place-items: center; min-width: 22px; height: 22px; border-radius: 11px; background: var(--yellow); color: var(--black); font: 600 13px/1 var(--num); box-shadow: 0 0 0 2px var(--enamel); }
.dock .sail { flex: 1.6; background: var(--blue); color: #fff; justify-content: flex-start; padding: 0 14px; gap: 12px; }
.dock .sail .flagsw { width: 26px; height: 18px; border-radius: 2px; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.8); background: var(--blue); position: relative; flex: none; }
.dock .sail .flagsw::after { content: ''; position: absolute; inset: 32% 32%; background: #fff; }
.dock .sail .lbl { display: flex; flex-direction: column; gap: 4px; }
.dock .sail .lbl b { font: 600 19px/1 var(--num); letter-spacing: 0.06em; }
.dock .sail .lbl small { font: 700 12px/1 var(--font); letter-spacing: 0.03em; text-transform: none; white-space: nowrap; }
.dock .sail.blocked { background: #7c8798; }
.dock .sail.blocked .flagsw { opacity: 0.6; }

/* ── Polished+: one notch bolder, same design ── */
.plus .port.here { box-shadow: inset 0 3px 0 var(--yellow), 0 2px 0 rgba(0, 0, 0, 0.25); }
.plus .port .rob.short { background: var(--black); color: var(--yellow); box-shadow: inset 0 -3px 0 var(--yellow); }
.plus .leg .bn { color: #fff; background: var(--band); padding: 2px 4px 1px; border-radius: 3px; font-size: 11.5px; }
.plus .leg.short .bn { background: var(--band); }
.plus .load .tot { font-size: 27px; }
.plus .zones span.on { box-shadow: 0 0 0 2px var(--navy); position: relative; z-index: 1; }
.plus .cells .now { position: absolute; bottom: -7px; width: 0; height: 0; margin-left: -6px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid var(--navy); z-index: 2; }
.plus .fuel .fa b { font-size: 30px; }
</style></head>
<body>
<div class="phone" id="ph"></div>
<script>
const LEVELS = {
  12: { n: 12, title: 'Short Stem', area: 'The Baltic', stars: [28, 30, 32], cap: 17, tank: 8, bands: [[5, 1], [11, 2], [17, 3]],
    ports: [{ code: 'KEL', name: 'Kiel', cc: 'de', price: 1 }, { code: 'LBC', name: 'Lübeck', cc: 'de', price: null }, { code: 'CPH', name: 'Copenhagen', cc: 'dk', price: 1 }, { code: 'GOT', name: 'Gothenburg', cc: 'se', price: null, final: true }],
    legs: [2, 1, 1], dests: [1, 2, 3] },
  2: { n: 2, title: 'The Stripe', area: 'North Sea', stars: [6, 7, 8], cap: 12, tank: 8, bands: [[9, 1], [12, 2]],
    ports: [{ code: 'RTM', name: 'Rotterdam', cc: 'nl', price: 3 }, { code: 'EBJ', name: 'Esbjerg', cc: 'dk', price: null, final: true }],
    legs: [2], dests: [1] },
};
const STATES = {
  'L12-mid': { lv: 12, cargo: [{ to: 2, w: 3 }], fuel: 5, start: 1, profit: 6 },
  'L12-ready': { lv: 12, cargo: [{ to: 2, w: 3 }], fuel: 6, start: 1, profit: 5 },
  'L2': { lv: 2, cargo: [], fuel: 1, start: 1, profit: 0 },
};
const PORT_COL = ['#5b6472', '#2c5da8', '#2f8a72', '#7b3f6e', '#b5482f'];
// band colours, darkened from #8fb3d9/#4a6fa5 so white text reads on the active zone (2 bands use the 1st and 3rd)
const BAND3 = ['#4f7fb8', '#34558c', '#1f2e4d'];
const RESERVE = 1;
const q = new URLSearchParams(location.search);
const S = STATES[q.get('s') ?? 'L12-mid'], L = LEVELS[S.lv];
if (q.get('v') === 'plus') document.body.classList.add('plus');
const bandCol = (b) => (L.bands.length === 2 ? [BAND3[0], BAND3[2]][b] : BAND3[b]);
const bandName = (b) => (L.bands.length === 2 ? ['LIGHT', 'LADEN'][b] : ['LIGHT', 'LADEN', 'DEEP'][b]);
const bandOf = (w) => { for (let i = 0; i < L.bands.length; i++) if (w <= L.bands[i][0]) return i; return L.bands.length - 1; };
function project(fuel) {
  const legs = []; let f = fuel, load = S.cargo.slice();
  L.legs.forEach((days, i) => {
    if (i > 0) load = load.filter((c) => c.to !== i);
    const w = load.reduce((s, c) => s + c.w, 0) + f, band = bandOf(w), burn = days * L.bands[band][1];
    legs.push({ w, band, burn, days, out: f, in: f - burn }); f -= burn;
  });
  return legs;
}
let until = 1; while (until < L.ports.length - 1 && L.ports[until].price === null) until++;
const legs = project(S.fuel);
let need = null; for (let f = S.start; f <= L.tank; f++) if (project(f).slice(0, until).every((l) => l.in >= RESERVE)) { need = f; break; }
const buy = need === null ? null : Math.max(0, need - S.fuel);
const cargoW = S.cargo.reduce((s, c) => s + c.w, 0), weight = cargoW + S.fuel;
const shortAt = (() => { for (let i = 0; i < until; i++) if (legs[i].in < RESERVE) return i + 1; return null; })();

const ICON = {
  pause: '<path d="M9 6v12M15 6v12"/>', undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.8.6 1.1 1.3 1.1 2.2h5c0-.9.3-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  fuel: '<path d="M12 3.5c3.5 4.6 5.5 7.6 5.5 10.2a5.5 5.5 0 0 1-11 0c0-2.6 2-5.6 5.5-10.2z" fill="#ee8b1e" stroke="none"/>',
};
const glyph = (n, s = 22) => `<svg class="g" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const star = (s) => `<svg class="g" width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
function flag(cc) {
  const f = { de: ['0 0 5 3', '<rect width="5" height="3"/><rect y="1" width="5" height="1" fill="#dd0000"/><rect y="2" width="5" height="1" fill="#ffce00"/>'],
    dk: ['0 0 37 28', '<rect width="37" height="28" fill="#c8102e"/><rect x="12" width="4" height="28" fill="#fff"/><rect y="12" width="37" height="4" fill="#fff"/>'],
    se: ['0 0 16 10', '<rect width="16" height="10" fill="#006aa7"/><rect x="5" width="2" height="10" fill="#fecc00"/><rect y="4" width="16" height="2" fill="#fecc00"/>'],
    nl: ['0 0 3 3', '<rect width="3" height="1" fill="#ae1c28"/><rect y="1" width="3" height="1" fill="#fff"/><rect y="2" width="3" height="1" fill="#21468b"/>'] }[cc];
  return `<svg class="flag" width="24" height="16" viewBox="${f[0]}" preserveAspectRatio="none">${f[1]}</svg>`;
}

function head() {
  const [t1, , t3] = L.stars, spread = Math.max(4, t3 - t1), lo = Math.max(0, t1 - spread * 1.6), hi = t3 + Math.max(2, spread * 0.25);
  const pos = (v) => `${Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100))}%`;
  return `<div class="hud-top"><div class="btn pause">${glyph('pause', 20)}</div><div class="title plate"><span class="lv">${L.n}</span><span class="tt"><b>${L.title}</b><small>${L.area}</small></span><span class="best">${star(15).repeat(3)}</span></div></div>
  <div class="rule plate"><div class="money num"><span class="cap">Profit</span><span><small>$</small>${S.profit}</span></div><div class="rcol"><div class="track">${L.stars.map((t, i) => `<div class="mark" style="left:${pos(t)}"><i>${'•'.repeat(i + 1)}</i></div>`).join('')}</div>
  <div class="legend">${L.stars.map((t, i) => `<span>${star(12).repeat(i + 1)}<b class="num">$${t}</b></span>`).join('')}</div></div></div>`;
}
function strip() {
  const P = L.ports.length, cols = [];
  for (let i = 0; i < P; i++) { cols.push('auto'); if (i < P - 1) cols.push('1fr'); }
  let h = '';
  L.ports.forEach((p, i) => {
    const here = i === 0, last = i === P - 1;
    const pump = last ? '<span class="pump fin">final</span>' : p.price === null ? '<span class="pump none">no fuel</span>' : `<span class="pump">${glyph('fuel', 12)}$${p.price}/t</span>`;
    const code = L.dests.includes(i) ? `<span class="code chip" style="--pc:${PORT_COL[i]}">${p.code}</span>` : `<span class="code">${p.code}</span>`;
    let rob = '<span></span>';
    if (i > 0 && i <= until) rob = shortAt === i ? '<span class="rob short">SHORT</span>' : shortAt !== null && i > shortAt ? '<span></span>' : `<span class="rob">${glyph('fuel', 11)}${legs[i - 1].in} t</span>`;
    h += `<div class="port ${here ? 'here' : ''}">${flag(p.cc)}${code}${pump}${rob}</div>`;
    if (!last) {
      const lg = legs[i], on = i < until, bad = shortAt === i + 1;
      h += `<div class="leg ${on ? '' : 'later'} ${bad ? 'short' : ''}" style="--band:${on ? bandCol(lg.band) : 'var(--enamel-3)'}"><span class="d">${lg.days} day${lg.days > 1 ? 's' : ''}</span><span class="arrow"></span>${on ? `<span class="burn">−${lg.burn} t</span><span class="bn">${bandName(lg.band)}</span>` : ''}</div>`;
    }
  });
  return `<div class="strip plate" style="grid-template-columns:${cols.join(' ')}">${h}</div>`;
}
function cargo() {
  const C = L.cap, cells = [];
  const dest = PORT_COL[S.cargo[0]?.to ?? 1];
  for (let k = 0; k < cargoW; k++) cells.push(`<i style="background:${dest}"></i>`);
  for (let k = 0; k < S.fuel; k++) cells.push('<i class="c-fuel"></i>');
  for (let k = 0; k < (buy ?? 0); k++) cells.push('<i class="c-need"></i>');
  while (cells.length < C) cells.push('<i></i>');
  const spare = C - weight;
  const sub = spare < 0 ? `<span class="sub bad">${-spare} t over</span>` : spare === 0 ? '<span class="sub mark">on marks</span>' : `<span class="sub">${spare} t spare</span>`;
  let prev = 0;
  const band = bandOf(weight);
  const zones = L.bands.map(([upTo, rate], i) => {
    const w = (upTo - prev) / C; prev = upTo;
    // the longest label that fits: NAME n t/day → n t/day → ×n (fitted after layout, below)
    return `<span class="${i === band ? 'on' : ''}" style="flex:${w};--zc:${bandCol(i)};--zt:${bandCol(i)}29" data-alt="${rate} t/day|×${rate}">${bandName(i)} <i>${rate} t/day</i></span>`;
  }).join('');
  const now = `<b class="now" style="left:${(weight / C) * 100}%"></b>`;
  const load = `<div class="load"><span class="tot num">${weight}<small>/${C} t</small></span><div class="cells" style="--n:${C}">${cells.join('')}<b class="smark" style="left:100%"></b>${document.body.classList.contains('plus') ? now : ''}</div>${sub}<div class="zones">${zones}</div></div>`;
  const p = L.ports[0];
  const btn = buy === null ? `<div class="btn buy" style="background:#7c8798">Can't<small>reach it</small></div>`
    : buy > 0 ? `<div class="btn buy"><span>Buy ${buy} <span class="u">t</span></span><small>$${buy * p.price}</small></div>`
    : `<div class="btn buy ok">${glyph('check', 16)}Enough</div>`;
  const bought = S.fuel - S.start;
  const fuel = `<div class="fuel"><div class="fl"><span class="cap">Fuel at <b>${p.name}</b> · $${p.price}/t</span><span class="fa"><b>${S.fuel}<small> t</small></b><span>aboard${bought ? ` · +${bought} t $${bought * p.price}` : ''}</span></span></div>
    <div class="btn tok">${glyph('minus', 18)}</div><div class="btn tok">${glyph('plus', 18)}</div>${btn}</div>`;
  return `<div class="cargo plate">${load}${fuel}</div>`;
}
function dock() {
  const next = L.ports[1].name;
  const blocked = buy !== 0;
  const sub = buy === null ? "can't reach the next pump" : buy > 0 ? `buy ${buy} t first` : `to ${next}${L.ports.length === 2 ? ' · final' : ''}`;
  return `<div class="dock"><div class="btn undo">${glyph('undo', 22)}</div><div class="btn hint">${glyph('bulb', 22)}<span>Hint</span></div><div class="btn sail ${blocked ? 'blocked' : ''}"><span class="flagsw"></span><span class="lbl"><b>Sail</b><small>${sub}</small></span></div></div>`;
}
const ph = document.getElementById('ph');
ph.style.backgroundImage = `url(assets/bg-${q.get('s') ?? 'L12-mid'}.png)`;
ph.innerHTML = head() + strip() + cargo() + dock();
document.fonts.ready.then(() => document.querySelectorAll('.zones span').forEach((z) => {
  const fits = () => { const r = document.createRange(); r.selectNodeContents(z); return r.getBoundingClientRect().width <= z.clientWidth - 10; };
  for (const alt of z.dataset.alt.split('|')) { if (fits()) break; z.innerHTML = `<i>${alt}</i>`; }
}));
</script>
