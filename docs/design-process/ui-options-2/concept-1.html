<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Her Marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Sofia+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Concept 1 — the ship is the gauge. The load bar goes; in its place, a close-up of her side amidships:
   navy topsides, red antifouling up to her marks, and the sea at the weight she'll sail at. The band
   limits are painted on the hull like draught marks (and on the 3D hull at the same heights), so the band
   is simply the pair of marks the water lies between. Red still showing is the room left. The route
   strip keeps one job: where the fuel runs out. */
.route { left: 10px; right: 10px; top: 110px; height: 94px; display: grid; grid-template-columns: 52px 1fr 52px 1fr 52px 1fr 52px; padding: 9px 10px 0; }
.pt { display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
.pt .chip { display: grid; place-items: center; height: 22px; min-width: 44px; padding: 0 5px; border-radius: 4px; background: var(--pc); color: #fff; font: 600 16px/1 var(--num); letter-spacing: 0.04em; }
.pt.here { align-self: start; background: var(--navy); border-radius: 6px; margin: -4px -2px 0; padding: 4px 0 8px; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.pt.here .pump { color: #fff; }
.pt.here .chip { background: transparent; padding: 0; }
.pt .pump { font: 700 12px/1 var(--font); color: var(--ink-2); white-space: nowrap; }
.pt .pump.dry { color: var(--red); }
.pt .rob { font: 600 15px/1 var(--num); color: var(--fuel-2); white-space: nowrap; }
.pt .rob small { font: 700 12px/1 var(--font); letter-spacing: 0.06em; color: var(--ink-2); margin-right: 3px; }
.pt .rob.bad { color: #fff; background: var(--red); padding: 2px 5px 1px; border-radius: 3px; }
.pt .rob.bad small { color: #fff; }
.pt .rob.on { color: var(--ok); }
.pt.later { opacity: 0.5; }
.lg { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 1px; min-width: 0; }
.lg .d { font: 700 12px/1 var(--font); color: var(--ink-2); white-space: nowrap; }
.lg .ln { position: relative; width: 100%; height: 5px; border-radius: 3px; background: var(--b); margin: 4px 0 3px; }
.lg .ln::after { content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%); border-left: 7px solid var(--b); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.lg.bad .ln { background: var(--hazard); }
.lg.bad .ln::after { border-left-color: var(--black); }
.lg .bn { font: 800 12px/1 var(--font); letter-spacing: 0.08em; color: var(--bt); }
.lg .bu { font: 600 15px/1 var(--num); color: var(--fuel-2); }
.lg.later .ln { background: #d5d3cb; }
.lg.later .ln::after { border-left-color: #d5d3cb; }

/* the hull plate: her side on the left (weight), the bunkers on the right (fuel) */
.hullp { left: 10px; right: 10px; top: 651px; height: 121px; }
.hullp > * { position: absolute; }
.gauge { left: 9px; top: 9px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.tag { left: 9px; transform: translateY(-50%); display: flex; align-items: center; height: 24px; padding: 0 8px 0 0; border-radius: 0 12px 12px 0; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); white-space: nowrap; }
.tag b { font: 600 18px/24px var(--num); color: var(--navy); padding: 0 6px 0 8px; }
.tag b small { font-size: 13px; margin-left: 1px; }
.tag span { font: 800 12px/1 var(--font); letter-spacing: 0.08em; color: #fff; background: var(--bc); padding: 4px 6px 3px; border-radius: 3px; }
.tag b em { font-style: normal; font-size: 13px; color: var(--ink-2); margin-right: 4px; }
.tag.held { transform: translateY(calc(-100% - 3px)); box-shadow: 0 0 0 2px var(--yellow), 0 1px 3px rgba(0,0,0,.35); }
.tag span i { font-style: normal; letter-spacing: 0.02em; font-weight: 700; }
.fu { left: 182px; right: 10px; top: 10px; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.fu .cap3 { position: absolute; left: 0; top: 0; font: 700 12px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.fu .big { margin-top: 17px; font: 600 30px/1 var(--num); color: var(--fuel-2); }
.fu .big small { font-size: 16px; margin-left: 1px; }
.fu .sm { font: 600 12.5px/1.25 var(--font); color: var(--ink-2); }
.acts { left: 182px; right: 10px; bottom: 9px; display: flex; gap: 6px; }
.acts .buy { flex: 1; min-width: 0; padding: 0 6px; }
.acts .buy .two b { font: 600 18px/1 var(--num); letter-spacing: 0.04em; white-space: nowrap; }
.acts .buy.done { background: transparent; color: var(--ok); box-shadow: inset 0 0 0 2px rgba(47, 138, 114, 0.5); }
.acts .buy.done .two b { display: flex; align-items: center; gap: 3px; font-size: 15px; letter-spacing: 0.01em; }
.acts .buy.done .sub { color: var(--ink-2); }
.acts .sq { color: var(--navy); }
.acts .buy.cant { background: #7c8798; color: #fff; box-shadow: 0 3px 0 #5d6779, var(--shadow-sm); }
.acts .buy.cant .two b { font-size: 17px; }
</style></head>
<body>
<div class="sheet">
  <header><b>1 · Her marks</b><span>The ship is the gauge: the sea against her side, with the bands painted on as draught marks.</span></header>
  <div class="phones">
    <div><div class="cap"><i></i>Mid-plan · Kiel · 1 t short</div><div class="phone" id="p1"></div></div>
    <div><div class="cap"><i class="touch"></i>Mid-plan · holding the 4 t box</div><div class="phone" id="p3"></div></div>
    <div><div class="cap"><i class="ok"></i>Ready to sail</div><div class="phone" id="p2"></div></div>
  </div>
</div>
<script src="shared.js"></script>
<script>
const BANDTXT = ['#4f7fb3', '#4a6fa5', '#1f2e4d'];
function route(s) {
  let h = '';
  LV.ports.forEach((p, i) => {
    const here = i === 0, later = i > s.until;
    const pump = p.final ? 'final' : p.price === null ? 'no fuel' : `$${p.price}/t`;
    let rob = here ? '' : '<span class="rob">&nbsp;</span>';
    if (i > 0 && i <= s.until) {
      const r = s.legs[i - 1].in;
      const bad = r < LV.reserve, on = i === s.until && r === LV.reserve;
      rob = `<span class="rob ${bad ? 'bad' : on ? 'on' : ''}">${r < 0 ? '<small>DRY</small>' : `<small>ROB</small>${r} t`}</span>`;
    }
    h += `<div class="pt ${here ? 'here' : ''} ${later ? 'later' : ''}" style="--pc:${p.color}">${flagSvg(p.cc, 22, 14)}<span class="chip">${p.code}</span><span class="pump ${p.price === null && !p.final ? 'dry' : ''}">${pump}</span>${rob}</div>`;
    if (i < LV.legs.length) {
      const L = s.legs[i];
      const on = i < s.until, bad = on && L.in < LV.reserve;
      h += `<div class="lg ${on ? '' : 'later'} ${bad ? 'bad' : ''}" style="--b:${BAND_COL[L.band]};--bt:${BANDTXT[L.band]}"><span class="d">${L.days} day${L.days > 1 ? 's' : ''}</span><span class="ln"></span>${on ? `<span class="bu">−${L.burn} t</span><span class="bn">${LV.ship.bands[L.band].name}</span>` : ''}</div>`;
    }
  });
  return `<div class="route plate">${h}</div>`;
}
/* her side amidships, 0 … 17 t: navy topsides, red antifouling up to her marks, the sea at her weight */
const GW = 160, GH = 105, TOP = 17, KK = (GH - TOP - 3) / 17;
const gy = (w) => TOP + (17 - w) * KK;
function gauge(s) {
  const wl = gy(s.weight);
  const base = s.held ? gy(s.weight - s.held) : wl; // the sea now, before the held box
  const id = s.fuel;
  let o = `<defs><clipPath id="gc${id}"><rect width="${GW}" height="${GH}" rx="5"/></clipPath>
    <linearGradient id="sea${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3d97cc" stop-opacity=".9"/><stop offset="1" stop-color="#1d5a8c" stop-opacity=".96"/></linearGradient>
    <linearGradient id="hl${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g clip-path="url(#gc${id})">
    <rect width="${GW}" height="${gy(17)}" fill="#1f2e4d"/>
    <rect y="${gy(17)}" width="${GW}" height="${GH}" fill="#b9412f"/>`;
  // the paint: her marks (load line and disc), the band limits as draught marks, the band names
  let paint = `<rect x="0" y="${gy(17) - 1.5}" width="${GW}" height="3" fill="#fff"/>`;
  paint += `<circle cx="${GW - 52}" cy="${gy(17)}" r="8.5" fill="none" stroke="#fff" stroke-width="2.4"/>`;
  LV.ship.bands.slice(0, -1).forEach((b) => (paint += `<rect x="0" y="${gy(b.upTo) - 1}" width="${GW}" height="2" fill="#fff"/>`));
  [17, ...LV.ship.bands.slice(0, -1).map((b) => b.upTo)].forEach((w) => (paint += `<text x="${GW - 7}" y="${gy(w) - 3.5}" text-anchor="end" font-family="Oswald" font-weight="600" font-size="13" fill="#fff">${w}</text>`));
  let lo = 0;
  LV.ship.bands.forEach((b, i) => {
    if (i !== s.band) paint += `<text x="10" y="${(gy(b.upTo) + gy(lo)) / 2 + 5}" font-family="Sofia Sans" font-weight="800" font-size="12" letter-spacing="1.2" fill="#fff">${b.name} <tspan font-weight="700" letter-spacing=".2">${b.rate} t/day</tspan></text>`;
    lo = b.upTo;
  });
  o += paint;
  // the sea, and the paint seen through it
  const wave = [];
  for (let x = -6; x <= GW + 6; x += 7) wave.push(`${x},${wl + ((x + 6) % 14 === 0 ? -1.5 : 1.3)}`);
  o += `<clipPath id="uw${id}"><polygon points="${wave.join(' ')} ${GW + 6},${GH + 2} -6,${GH + 2}"/></clipPath>`;
  if (s.held) {
    // the held box: where the sea would come to, hatched above where it is now
    o += `<pattern id="gh${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#3d97cc" opacity=".55"/><rect width="3" height="7" fill="#e8f6ff" opacity=".55"/></pattern>`;
    o += `<polygon points="${wave.join(' ')} ${GW + 6},${base} -6,${base}" fill="url(#gh${id})"/>`;
    o += `<rect x="-2" y="${base}" width="${GW + 4}" height="${GH}" fill="url(#sea${id})"/>`;
    o += `<line x1="0" x2="${GW}" y1="${base}" y2="${base}" stroke="#e8f6ff" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    o += `<g clip-path="url(#uw${id})" opacity=".55">${paint}</g>`;
    o += `<polyline points="${wave.join(' ')}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 3"/>`;
    o += `<rect width="${GW}" height="${GH}" fill="url(#hl${id})"/></g>`;
    return `<svg class="gauge" width="${GW}" height="${GH}" viewBox="0 0 ${GW} ${GH}">${o}</svg>`;
  }
  o += `<polygon points="${wave.join(' ')} ${GW + 6},${GH + 2} -6,${GH + 2}" fill="url(#sea${id})"/>`;
  o += `<g clip-path="url(#uw${id})" opacity=".55">${paint}</g>`;
  o += `<polyline points="${wave.join(' ')}" fill="none" stroke="#e8f6ff" stroke-width="1.8"/>`;
  o += `<rect width="${GW}" height="${GH}" fill="url(#hl${id})"/></g>`;
  return `<svg class="gauge" width="${GW}" height="${GH}" viewBox="0 0 ${GW} ${GH}">${o}</svg>`;
}
function plate(s) {
  const b = LV.ship.bands[s.band];
  let h = gauge(s);
  h += `<div class="tag ${s.held ? 'held' : ''}" style="top:${9 + gy(s.weight)}px;--bc:${BAND_COL[s.band]}"><b>${s.held ? `<em>+${s.held}</em>` : ''}${s.weight}<small> t</small></b><span>${b.name} <i>${b.rate} t/day</i></span></div>`;
  h += `<div class="fu"><span class="cap3">Bunkers</span><span class="big">${s.fuel}<small> t</small></span><span class="sm">aboard · +${s.bought} t $${s.cost}</span></div>`;
  const buy = s.buy === null
    ? `<div class="btn buy cant"><span class="two"><b>Can't</b><span class="sub">reach CPH</span></span></div>`
    : s.buy > 0
    ? `<div class="btn fuel buy"><span class="two"><b>Buy ${s.buy} t</b><span class="sub">$${s.buy * LV.ports[0].price}</span></span></div>`
    : `<div class="btn buy done"><span class="two"><b>${glyph('check', 16, 2.6)}Enough</b></span></div>`;
  h += `<div class="acts"><div class="btn sq">${glyph('minus', 18)}</div><div class="btn sq">${glyph('plus', 18)}</div>${buy}</div>`;
  return `<div class="hullp plate">${h}</div>`;
}
function phone(el, s) {
  const sail = s.buy === null ? { blocked: true, sub: "can't reach CPH" } : s.buy > 0 ? { blocked: true, sub: `buy ${s.buy} t first` } : { blocked: false, sub: 'to Lübeck' };
  el.innerHTML = headHtml(s.profit) + route(s) + plate(s) + dockHtml(sail);
}
phone(document.getElementById('p1'), MID);
phone(document.getElementById('p2'), READY);
phone(document.getElementById('p3'), HELD);
</script>
</body></html>
