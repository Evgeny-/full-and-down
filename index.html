    <!-- Inline artwork keeps the first paint complete before scripts and fonts arrive. -->
    <style>
      .boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; box-sizing: border-box; padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); background: #f8f7f2; color: #1f2e4d; transition: opacity .45s ease; }
      .boot.out { opacity: 0; pointer-events: none; }
      .boot-content { width: min(760px, 100%); text-align: center; transform: translateY(-3vh); }
      .boot-scene { display: block; width: 100%; height: auto; }
      .boot-title { margin: 8px 0 0; line-height: 0; }
      .boot-title .boot-lettering { display: block; width: clamp(236px, 48vw, 390px); max-width: 100%; height: auto; margin: 0 auto; }
      .boot-status, .boot-noscript { margin: 18px 0 0; font-family: 'Sofia Sans Variable', 'Sofia Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: #4d626c; }
      .boot-status { display: inline-flex; align-items: center; gap: 9px; }
      .boot-status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #ee8b1e; animation: boot-pulse 2.4s ease-in-out infinite; }
      .boot-ship { animation: boot-float 5.4s ease-in-out infinite; }
      .boot-wake { animation: boot-wake 5.4s ease-in-out infinite; }
      @keyframes boot-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
      @keyframes boot-wake { 0%, 100% { opacity: .5; } 50% { opacity: .85; } }
      @keyframes boot-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (max-width: 480px) { .boot { padding-inline: 8px; } .boot-content { transform: translateY(-4vh); } .boot-title { margin-top: 24px; } }
      @media (max-height: 460px) and (min-width: 600px) { .boot-content { width: min(520px, 100%); transform: none; } .boot-title { margin-top: 0; } .boot-title .boot-lettering { width: 260px; } .boot-status, .boot-noscript { margin-top: 9px; } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot * { animation: none !important; transition: none !important; } }
    </style>
