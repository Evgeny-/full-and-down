<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Port Nations</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #e9f2f4; --card: #fbfdfd; --ink: #16303a; --muted: #5c7480; --line: #c9dbe0; --bad: #c8321e; --ok: #1f7a4c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 500 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 10px 16px 40px; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    #summary { color: var(--muted); margin-bottom: 8px; }
    #summary b.bad { color: var(--bad); }
    #summary b.ok { color: var(--ok); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); gap: 6px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; align-items: start; }
    .card .small { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .card .zoom { image-rendering: pixelated; width: 72px; height: 48px; }
    .card .label { grid-column: 1 / -1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .label code { font-weight: 700; margin-right: 4px; }
    canvas, img { display: block; }
    .ports { margin-top: 12px; columns: 6 170px; font-size: 11px; color: var(--muted); }
    .ports div.bad { color: var(--bad); font-weight: 700; }
  </style>
</head>
<body>
  <h1>Full &amp; Down · port nations</h1>
  <div id="summary"></div>
  <div class="grid" id="grid"></div>
  <div class="ports" id="ports"></div>
  <script type="module" src="./nations.ts"></script>
</body>
</html>
